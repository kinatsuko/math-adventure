<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Adventure Tahun 6</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fef3c7);
    min-height: 100vh;
    color: #1f2937;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 20px;
}

/* =========================
HEADER
========================= */

.header {
    background: white;
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 30px;
    font-weight: 800;
}

.subtitle {
    color: #6b7280;
    margin-top: 5px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #f3f4f6;
    padding: 14px;
    border-radius: 14px;
    text-align: center;
    font-weight: bold;
}

.stat span {
    color: #2563eb;
    font-size: 20px;
}

/* =========================
PLAYER
========================= */

.player-box {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.07);
}

.player-box input {
    width: 100%;
    padding: 14px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    margin-top: 8px;
}

.player-box button {
    margin-top: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
MAP
========================= */

.map {
    background: white;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.map h2 {
    margin-bottom: 20px;
}

.world-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.world {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.world:hover {
    transform: translateY(-5px);
}

.world.locked {
    opacity: .45;
    cursor: not-allowed;
}

.world.completed {
    background: #f0fdf4;
    border-color: #22c55e;
}

.world-icon {
    font-size: 45px;
}

.world-name {
    font-size: 18px;
    font-weight: bold;
    margin-top: 8px;
}

.world-status {
    margin-top: 8px;
    color: #6b7280;
    font-size: 13px;
}

/* =========================
STAGE MENU
========================= */

.stage-menu {
    display: none;
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.stage-menu.active {
    display: block;
}

.stage-title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 25px;
}

.stage-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.stage {
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    border: 3px solid #e5e7eb;
    transition: .2s;
}

.stage:hover {
    transform: translateY(-5px);
}

.easy {
    background: #f0fdf4;
    border-color: #22c55e;
}

.medium {
    background: #fffbeb;
    border-color: #f59e0b;
}

.boss {
    background: #fef2f2;
    border-color: #ef4444;
}

.stage.locked {
    opacity: .45;
    cursor: not-allowed;
}

.stage.completed {
    box-shadow: 0 0 0 4px #22c55e;
}

.stage-icon {
    font-size: 50px;
}

.stage-name {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.stage-info {
    color: #6b7280;
}

/* =========================
GAME
========================= */

.game {
    display: none;
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.game.active {
    display: block;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.question-number {
    color: #6b7280;
    margin-top: 5px;
}

.difficulty {
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
}

.difficulty.easy {
    color: #166534;
}

.difficulty.medium {
    color: #92400e;
}

.difficulty.boss {
    color: #991b1b;
}

.question {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    margin: 40px 0;
    line-height: 1.5;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.answer {
    padding: 18px;
    border: 2px solid #d1d5db;
    background: white;
    border-radius: 15px;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
}

.answer:hover {
    background: #eff6ff;
    border-color: #2563eb;
}

.answer.correct {
    background: #dcfce7;
    border-color: #22c55e;
}

.answer.wrong {
    background: #fee2e2;
    border-color: #ef4444;
}

.answer:disabled {
    cursor: not-allowed;
}

.feedback {
    min-height: 35px;
    text-align: center;
    margin: 20px 0;
    font-size: 20px;
    font-weight: bold;
}

.game-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.btn-next {
    background: #2563eb;
    color: white;
}

.btn-hint {
    background: #facc15;
    color: #713f12;
}

.btn-map {
    background: #e5e7eb;
}

/* =========================
HINT
========================= */

.hint-box {
    display: none;
    background: #fffbeb;
    border: 2px solid #facc15;
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
    text-align: center;
}

.hint-box.show {
    display: block;
}

/* =========================
RESULT
========================= */

.result {
    display: none;
    background: white;
    border-radius: 22px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.result.active {
    display: block;
}

.result-icon {
    font-size: 80px;
}

.result h2 {
    font-size: 32px;
    margin: 15px 0;
}

.result-score {
    font-size: 24px;
    margin: 15px;
}

.result-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
}

/* =========================
PROGRESS
========================= */

.progress-container {
    margin-top: 15px;
}

.progress {
    height: 12px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: .4s;
}

/* =========================
BADGE
========================= */

.badge {
    display: inline-block;
    background: #fef3c7;
    border: 2px solid #f59e0b;
    padding: 10px 15px;
    border-radius: 20px;
    margin-top: 15px;
    font-weight: bold;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width: 800px) {

    .world-grid,
    .stage-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {

    .world-grid,
    .stage-grid,
    .answers {
        grid-template-columns: 1fr;
    }

    .title {
        font-size: 23px;
    }

    .question {
        font-size: 22px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- =========================
HEADER
========================= -->

<div class="header">

    <div class="header-top">

        <div>
            <div class="title">
                🧮 Math Adventure Tahun 6
            </div>

            <div class="subtitle">
                Belajar • Bermain • Naik Level • Jadi Math Champion
            </div>
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            ⭐ XP
            <br>
            <span id="xp">0</span>
        </div>

        <div class="stat">
            🏆 Skor
            <br>
            <span id="score">0</span>
        </div>

        <div class="stat">
            ❤️ Nyawa
            <br>
            <span id="lives">3</span>
        </div>

        <div class="stat">
            🆙 Level
            <br>
            <span id="level">1</span>
        </div>

    </div>

    <div class="progress-container">

        <strong>Progress Dunia</strong>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

    </div>

</div>


<!-- =========================
PLAYER
========================= -->

<div class="player-box">

    <strong>👨‍🎓 Nama Murid</strong>

    <input
        type="text"
        id="playerName"
        placeholder="Masukkan nama murid"
    >

    <button onclick="savePlayer()">
        💾 Simpan Nama
    </button>

    <span id="playerMessage"></span>

</div>


<!-- =========================
WORLD MAP
========================= -->

<div class="map" id="map">

    <h2>🗺️ Peta Math Adventure</h2>

    <div
        class="world-grid"
        id="worldGrid">
    </div>

</div>


<!-- =========================
STAGE MENU
========================= -->

<div
    class="stage-menu"
    id="stageMenu">

    <h2
        class="stage-title"
        id="stageTitle">
    </h2>

    <div
        class="stage-grid"
        id="stageGrid">
    </div>

    <br>

    <div style="text-align:center">

        <button
            class="btn btn-map"
            onclick="backToMap()">

            ← Kembali ke Peta

        </button>

    </div>

</div>


<!-- =========================
GAME
========================= -->

<div
    class="game"
    id="game">

    <div class="game-header">

        <div>

            <h2 id="gameWorldTitle">
            </h2>

            <div
                class="question-number"
                id="questionNumber">
            </div>

        </div>

        <div
            class="difficulty"
            id="difficulty">
        </div>

    </div>


    <div
        class="question"
        id="question">
    </div>


    <div
        class="answers"
        id="answers">
    </div>


    <div
        class="feedback"
        id="feedback">
    </div>


    <div
        class="hint-box"
        id="hintBox">
    </div>


    <div class="game-buttons">

        <button
            class="btn btn-hint"
            onclick="showHint()">

            💡 Hint

        </button>

        <button
            class="btn btn-next"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none">

            Seterusnya →

        </button>

        <button
            class="btn btn-map"
            onclick="backToMap()">

            🗺️ Peta

        </button>

    </div>

</div>


<!-- =========================
RESULT
========================= -->

<div
    class="result"
    id="result">

    <div
        class="result-icon"
        id="resultIcon">
        🏆
    </div>

    <h2 id="resultTitle">
        Tahniah!
    </h2>

    <div class="result-score">

        Skor:
        <strong id="finalScore">
            0
        </strong>

    </div>

    <div>

        ⭐ XP:
        <strong id="finalXP">
            0
        </strong>

    </div>

    <div
        id="resultMessage"
        style="margin-top:15px">
    </div>

    <div
        class="badge"
        id="badge">
    </div>

    <div class="result-buttons">

        <button
            class="btn btn-next"
            id="continueBtn"
            onclick="continueAdventure()">

            ➡️ Teruskan

        </button>

        <button
            class="btn btn-map"
            onclick="backToMap()">

            🗺️ Peta

        </button>

    </div>

</div>


</div>


<script>

/* =========================================================
DATA WORLD
========================================================= */

const worlds = [

{
    id: 1,
    icon: "🔢",
    name: "Dunia Nombor",

    easy: [

        {
            q: "Apakah nilai digit 5 dalam 35,621?",
            a: ["5", "50", "500", "5,000"],
            correct: 3,
            hint: "Digit 5 berada di tempat ribu."
        },

        {
            q: "Berapakah 10,000 + 5,000?",
            a: ["15,000", "14,000", "16,000", "10,500"],
            correct: 0,
            hint: "Tambah 10 ribu dengan 5 ribu."
        },

        {
            q: "Apakah nombor terbesar?",
            a: ["4,123", "4,321", "4,213", "4,312"],
            correct: 1,
            hint: "Bandingkan digit dari kiri."
        },

        {
            q: "Berapakah 5,000 + 2,000?",
            a: ["6,000", "7,000", "8,000", "9,000"],
            correct: 1,
            hint: "5 ribu tambah 2 ribu."
        },

        {
            q: "Apakah nilai tempat digit 7 dalam 27,456?",
            a: ["Ribu", "Puluh ribu", "Ratus", "Puluh"],
            correct: 0,
            hint: "Lihat kedudukan 7 dari kanan."
        }

    ],

    medium: [

        {
            q: "Bundarkan 45,678 kepada ribu terdekat.",
            a: ["45,000", "46,000", "45,700", "50,000"],
            correct: 1,
            hint: "Lihat digit ratus."
        },

        {
            q: "Apakah nombor 6 digit paling kecil?",
            a: ["10,000", "100,000", "999,999", "1,000"],
            correct: 1,
            hint: "Nombor 6 digit bermula pada 100,000."
        },

        {
            q: "35,000 + 7,500 = ?",
            a: ["41,500", "42,500", "43,500", "44,500"],
            correct: 1,
            hint: "Tambah ribu dan ratus."
        },

        {
            q: "90,000 − 25,000 = ?",
            a: ["55,000", "60,000", "65,000", "75,000"],
            correct: 2,
            hint: "90 − 25."
        },

        {
            q: "Apakah nombor selepas 99,999?",
            a: ["99,998", "100,000", "100,001", "99,000"],
            correct: 1,
            hint: "Tambah 1."
        }

    ],

    boss: [

        {
            q: "Sebuah nombor mempunyai 6 digit. Digit ratus ribu ialah 4 dan digit puluh ribu ialah 7. Apakah nombor paling kecil yang boleh dibentuk?",
            a: ["470,000", "407,000", "400,700", "470,001"],
            correct: 1,
            hint: "Gunakan digit lain sebagai 0."
        },

        {
            q: "Apakah beza antara 125,000 dan 78,500?",
            a: ["45,500", "46,500", "47,500", "48,500"],
            correct: 2,
            hint: "125,000 − 78,500."
        },

        {
            q: "Sebuah kilang menghasilkan 25,000 barang setiap bulan. Berapa barang dalam 4 bulan?",
            a: ["50,000", "75,000", "100,000", "125,000"],
            correct: 2,
            hint: "25,000 × 4."
        },

        {
            q: "Nombor A ialah 35,000. Nombor B adalah 7,500 lebih besar. Apakah B?",
            a: ["40,500", "41,500", "42,500", "43,500"],
            correct: 2,
            hint: "35,000 + 7,500."
        },

        {
            q: "Ali mempunyai 100,000 mata. Dia menggunakan 37,500 mata. Berapa tinggal?",
            a: ["62,500", "63,500", "64,500", "67,500"],
            correct: 0,
            hint: "100,000 − 37,500."
        }

    ]
},

{
    id: 2,
    icon: "➕",
    name: "Dunia Operasi",

    easy: [

        {
            q: "345 + 276 = ?",
            a: ["611", "621", "631", "641"],
            correct: 1,
            hint: "Tambah dari sa hingga ribu."
        },

        {
            q: "800 − 365 = ?",
            a: ["425", "435", "445", "455"],
            correct: 1,
            hint: "Tolak 365 daripada 800."
        },

        {
            q: "24 × 6 = ?",
            a: ["124", "134", "144", "154"],
            correct: 2,
            hint: "24 + 24 + 24 + 24 + 24 + 24."
        },

        {
            q: "144 ÷ 12 = ?",
            a: ["10", "11", "12", "14"],

        },

        {
            q: "25 + 35 = ?",
            a: ["50", "60", "70", "80"],
            correct: 1,

    ],

    medium: [

            q: "125 + 45 × 2 = ?",
            a: ["215", "300", "250", "170"],

        },

        {
            q: "600 ÷ 5 + 20 = ?",

        {
            q: "45 × 8 = ?",
            a: ["320", "340", "360", "380"],

        },

        {
            q: "900 − 250 + 50 = ?",
            a: ["600", "650", "700", "750"],

        },

        {
            q: "720 ÷ 8 = ?",

    ],

{
    id: 3,

        {

        {

        },

        {
            q: "5/6 − 2/6 = ?",

        },

        {
            q: "1/2 + 1/2 = ?",
            a: ["1/2", "1", "2", "3/2"],

        },

        {
            q: "3/4 bersamaan berapa peratus?",

        },

        {
            q: "2/5 bersamaan?",
            a: ["20%", "30%", "40%", "50%"],

            hint: "1/5 = 20%."
        }

    ],

    boss: [

        {
            q: "Ali makan 1/4 kek dan adiknya makan 2/4. Berapa bahagian kek telah dimakan?",

            hint: "1/4 + 2/4."
        },

        {
            q: "Siti mempunyai 3/4 L air. Dia minum 1/4 L. Berapa tinggal?",

            correct: 1,
            hint: "3/4 − 1/4."
        },

        {
            q: "Sebuah pizza dipotong kepada 8 bahagian. Ali makan 3 bahagian. Apakah pecahan yang tinggal?",
            a: ["3/8", "4/8", "5/8", "6/8"],
            correct: 2,
            hint: "8 − 3."
        },

        {
            q: "1/2 daripada 20 murid ialah berapa murid?",
            a: ["5", "10", "15", "20"],
            correct: 1,
            hint: "Bahagi 20 kepada 2."
        },

/* =========================================================
GAME STATE
========================================================= */

let xp = Number(localStorage.getItem("mathXP")) || 0;
let score = Number(localStorage.getItem("mathScore")) || 0;
let level = Number(localStorage.getItem("mathLevel")) || 1;

let lives = 3;

let playerName =
    localStorage.getItem("mathPlayerName") || "";

let currentWorld = 0;
let currentStage = "";
let currentQuestion = 0;

let stageScore = 0;
let hintUsed = false;

let completedStages =
    JSON.parse(
        localStorage.getItem("completedStages") || "{}"
    );


/* =========================================================
ELEMENTS
========================================================= */

const map =
    document.getElementById("map");

const stageMenu =
    document.getElementById("stageMenu");

const game =
    document.getElementById("game");

const result =
    document.getElementById("result");


/* =========================================================
PLAYER
========================================================= */

document.getElementById("playerName").value =
    playerName;


function savePlayer() {

    const name =
        document.getElementById("playerName").value.trim();

    if (!name) {

        alert("Sila masukkan nama murid.");

        return;
    }

    playerName = name;

    localStorage.setItem(
        "mathPlayerName",
        playerName
    );

    document.getElementById(
        "playerMessage"
    ).textContent =
        " ✅ Nama disimpan!";

}


/* =========================================================
RENDER WORLD
========================================================= */

function renderWorlds() {

    const grid =
        document.getElementById("worldGrid");

    grid.innerHTML = "";

    worlds.forEach((world, index) => {

        const div =
            document.createElement("div");

        const unlocked =
            index === 0 ||
            isWorldCompleted(index - 1);

        const completed =
            isWorldCompleted(index);

        div.className = "world";

        if (!unlocked) {

            div.classList.add("locked");

        }

        if (completed) {

            div.classList.add("completed");

        }

        div.innerHTML = `

            <div class="world-icon">
                ${world.icon}
            </div>

            <div class="world-name">
                ${world.name}
            </div>

            <div class="world-status">

                ${
                    completed
                    ? "🏆 Dunia Selesai"

                    : unlocked
                    ? "▶ Boleh Dimainkan"

                    : "🔒 Terkunci"
                }

            </div>

        `;

        if (unlocked) {

            div.onclick =
                () => openStageMenu(index);

        }

        grid.appendChild(div);

    });

    updateStats();

}


/* =========================================================
OPEN STAGE MENU
========================================================= */

function openStageMenu(index) {

    currentWorld = index;

    map.style.display = "none";

    stageMenu.classList.add("active");

    game.classList.remove("active");

    result.classList.remove("active");

    document.getElementById(
        "stageTitle"
    ).textContent =
        `${worlds[index].icon} ${worlds[index].name}`;

    renderStages();

}


/* =========================================================
RENDER STAGES
========================================================= */

function renderStages() {

    const grid =
        document.getElementById("stageGrid");

    grid.innerHTML = "";

    const stages = [

        {
            id: "easy",
            icon: "🟢",
            name: "Mudah",
            class: "easy",
            xp: 20
        },

        {
            id: "medium",
            icon: "🟡",
            name: "Sederhana",
            class: "medium",
            xp: 40
        },

        {
            id: "boss",
            icon: "🔴",
            name: "BOSS",
            class: "boss",
            xp: 75
        }

    ];

    stages.forEach((stage, index) => {

        const completed =
            isStageCompleted(
                currentWorld,
                stage.id
            );

        let unlocked = false;

        if (index === 0) {

            unlocked = true;

        } else {

            const previous =
                stages[index - 1].id;

            unlocked =
                isStageCompleted(
                    currentWorld,
                    previous
                );

        }

        const div =
            document.createElement("div");

        div.className =
            `stage ${stage.class}`;

        if (!unlocked) {

            div.classList.add("locked");

        }

        if (completed) {

            div.classList.add("completed");

        }

        div.innerHTML = `

            <div class="stage-icon">
                ${stage.icon}
            </div>

            <div class="stage-name">
                ${stage.name}
            </div>

            <div class="stage-info">

                ${completed
                    ? "✅ SELESAI"
                    : unlocked
                    ? `▶ Main • +${stage.xp} XP`
                    : "🔒 Terkunci"
                }

            </div>

        `;

        if (unlocked && !completed) {

            div.onclick =
                () => startStage(stage.id);

        }

        grid.appendChild(div);

    });

}


/* =========================================================
START STAGE
========================================================= */

function startStage(stage) {

    currentStage = stage;

    currentQuestion = 0;

    stageScore = 0;

    hintUsed = false;

    lives = 3;

    stageMenu.classList.remove("active");

    game.classList.add("active");

    result.classList.remove("active");

    loadQuestion();

}


/* =========================================================
LOAD QUESTION
========================================================= */

function loadQuestion() {

    const questions =
        worlds[currentWorld][currentStage];

    const q =
        questions[currentQuestion];

    const difficultyNames = {

        easy: "🟢 MUDAH",

        medium: "🟡 SEDERHANA",

        boss: "🔴 BOSS"

    };

    document.getElementById(
        "gameWorldTitle"
    ).textContent =
        `${worlds[currentWorld].icon} ${worlds[currentWorld].name}`;

    document.getElementById(
        "questionNumber"
    ).textContent =
        `Soalan ${currentQuestion + 1} / ${questions.length}`;

    const difficulty =
        document.getElementById("difficulty");

    difficulty.textContent =
        difficultyNames[currentStage];

    difficulty.className =
        `difficulty ${currentStage}`;

    document.getElementById(
        "question"
    ).textContent =
        q.q;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";

    q.a.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.className =
            "answer";

        button.textContent =
            answer;

        button.onclick =
            () => checkAnswer(index, button);

        answers.appendChild(button);

    });

    document.getElementById(
        "feedback"
    ).textContent = "";

    document.getElementById(
        "nextBtn"
    ).style.display = "none";

    document.getElementById(
        "hintBox"
    ).classList.remove("show");

    updateStats();

}


/* =========================================================
CHECK ANSWER
========================================================= */

function checkAnswer(selected, button) {

    const questions =
        worlds[currentWorld][currentStage];

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn => {

        btn.disabled = true;

    });


    if (selected === q.correct) {

        button.classList.add("correct");

        stageScore++;

        let earnedXP = 5;

        if (currentStage === "easy") {

            earnedXP = 5;

        }

        if (currentStage === "medium") {

            earnedXP = 10;

        }

        if (currentStage === "boss") {

            earnedXP = 15;

        }

        xp += earnedXP;

        score += earnedXP;

        document.getElementById(
            "feedback"
        ).textContent =
            `🎉 BETUL! +${earnedXP} XP`;

        saveProgress();

        updateStats();

        document.getElementById(
            "nextBtn"
        ).style.display =
            "inline-block";

    } else {

        button.classList.add("wrong");

        buttons[q.correct]
            .classList.add("correct");

        lives--;

        document.getElementById(
            "feedback"
        ).textContent =
            "❌ Belum betul. Cuba lagi!";

        if (lives <= 0) {

            lives = 3;

            document.getElementById(
                "feedback"
            ).textContent =
                "❤️ Nyawa habis. Cuba semula!";

        }

        updateStats();

        /*
        PENTING:

        Bila salah, kita BENARKAN
        murid cuba soalan tersebut lagi.
        */

        setTimeout(() => {

            buttons.forEach(btn => {

                btn.disabled = false;

                btn.classList.remove(
                    "wrong",
                    "correct"
                );

            });

            document.getElementById(
                "feedback"
            ).textContent =
                "💪 Cuba sekali lagi!";

        }, 1000);

    }

}


/* =========================================================
NEXT QUESTION
========================================================= */

function nextQuestion() {

    const questions =
        worlds[currentWorld][currentStage];

    currentQuestion++;

    if (
        currentQuestion >=
        questions.length
    ) {

        completeStage();

        return;

    }

    loadQuestion();

}


/* =========================================================
COMPLETE STAGE
========================================================= */

function completeStage() {

    markStageCompleted(
        currentWorld,
        currentStage
    );

    let bonusXP = 0;

    if (currentStage === "easy") {

        bonusXP = 20;

    } else if (currentStage === "medium") {

        bonusXP = 40;

    } else {

        bonusXP = 75;

    }

    xp += bonusXP;

    score += bonusXP;

    saveProgress();

    game.classList.remove("active");

    result.classList.add("active");

    const percentage =
        Math.round(
            (stageScore /
            worlds[currentWorld][currentStage].length)
            * 100
        );


    if (currentStage === "easy") {

        document.getElementById(
            "resultIcon"
        ).textContent = "🟢";

        document.getElementById(
            "resultTitle"
        ).textContent =
            "Stage Mudah Selesai!";

        document.getElementById(
            "resultMessage"
        ).innerHTML =
            `
            Hebat ${playerName || "Murid"}! 🎉
            <br><br>
            Anda telah menguasai asas dunia ini.
            <br>
            <strong>Stage Sederhana telah dibuka! 🔓</strong>
            `;

        document.getElementById(
            "continueBtn"
        ).textContent =
            "🟡 Ke Stage Sederhana";

    }


    else if (currentStage === "medium") {

        document.getElementById(
            "resultIcon"
        ).textContent = "🟡";

        document.getElementById(
            "resultTitle"
        ).textContent =
            "Stage Sederhana Selesai!";

        document.getElementById(
            "resultMessage"
        ).innerHTML =
            `
            Hebat! 🔥
            <br><br>
            Anda semakin dekat dengan Boss!
            <br>
            <strong>Stage BOSS telah dibuka! 🔓</strong>
            `;

        document.getElementById(
            "continueBtn"
        ).textContent =
            "🔴 Lawan BOSS";

    }


    else {

        document.getElementById(
            "resultIcon"
        ).textContent = "👑";

        document.getElementById(
            "resultTitle"
        ).textContent =
            "BOSS DIKALAHKAN!";

        document.getElementById(
            "resultMessage"
        ).innerHTML =
            `
            🎉 TAHNIAH!
            <br><br>
            Anda berjaya menguasai:
            <br>
            <strong>
            ${worlds[currentWorld].name}
            </strong>
            <br><br>
            Dunia seterusnya telah dibuka! 🔓
            `;

        document.getElementById(
            "continueBtn"
        ).textContent =
            "➡️ Dunia Seterusnya";

    }


    document.getElementById(
        "finalScore"
    ).textContent =
        stageScore * 10;

    document.getElementById(
        "finalXP"
    ).textContent =
        bonusXP;

    document.getElementById(
        "badge"
    ).textContent =
        `🏅 ${getBadge(percentage)}`;

    updateStats();

}


/* =========================================================
CONTINUE
========================================================= */

function continueAdventure() {

    result.classList.remove("active");

    if (currentStage === "easy") {

        startStage("medium");

        return;

    }

    if (currentStage === "medium") {

        startStage("boss");

        return;

    }

    if (currentStage === "boss") {

        if (
            currentWorld <
            worlds.length - 1
        ) {

            currentWorld++;

            openStageMenu(currentWorld);

        } else {

            showFinalChampion();

        }

    }

}


/* =========================================================
FINAL CHAMPION
========================================================= */

function showFinalChampion() {

    map.style.display = "none";

    stageMenu.classList.remove("active");

    game.classList.remove("active");

    result.classList.add("active");

    document.getElementById(
        "resultIcon"
    ).textContent =
        "👑";

    document.getElementById(
        "resultTitle"
    ).textContent =
        "MATH LEGEND!";

    document.getElementById(
        "resultMessage"
    ).innerHTML =
        `
        <strong>
        TAHNIAH ${playerName || "MURID"}!
        </strong>
        <br><br>

        Anda telah berjaya menamatkan
        <strong>SEMUA DUNIA MATEMATIK TAHUN 6!</strong>

        <br><br>

        🔢 Nombor<br>
        ➕ Operasi<br>
        🍕 Pecahan<br>
        🔵 Perpuluhan<br>
        % Peratus<br>
        💰 Wang<br>
        ⏰ Masa<br>
        📏 Ukuran<br>
        📐 Ruang<br>
        📊 Data<br>
        🧠 Penyelesaian Masalah<br>
        👑 Final Boss

        <br><br>

        <strong>
        ANDA ADALAH MATH LEGEND! 🏆
        </strong>
        `;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalXP"
    ).textContent =
        xp;

    document.getElementById(
        "badge"
    ).textContent =
        "👑 MATH LEGEND";

    document.getElementById(
        "continueBtn"
    ).textContent =
        "🗺️ Lihat Peta";

    document.getElementById(
        "continueBtn"
    ).onclick =
        backToMap;

}


/* =========================================================
HINT
========================================================= */

function showHint() {

    const questions =
        worlds[currentWorld][currentStage];

    const q =
        questions[currentQuestion];

    const box =
        document.getElementById("hintBox");

    box.textContent =
        `💡 Hint: ${q.hint}`;

    box.classList.add("show");

}


/* =========================================================
BADGE
========================================================= */

function getBadge(percentage) {

    if (percentage === 100) {

        return "PERFECT MASTER 🌟";

    }

    if (percentage >= 80) {

        return "MATH HERO 🦸";

    }

    if (percentage >= 60) {

        return "MATH EXPLORER 🧭";

    }

    return "BRAVE LEARNER 💪";

}


/* =========================================================
COMPLETION
========================================================= */

function markStageCompleted(world, stage) {

    if (!completedStages[world]) {

        completedStages[world] = {};

    }

    completedStages[world][stage] = true;

}


function isStageCompleted(world, stage) {

    return (
        completedStages[world] &&
        completedStages[world][stage]
    );

}


function isWorldCompleted(world) {

    return (
        isStageCompleted(world, "easy") &&
        isStageCompleted(world, "medium") &&
        isStageCompleted(world, "boss")
    );

}


/* =========================================================
SAVE
========================================================= */

function saveProgress() {

    localStorage.setItem(
        "mathXP",
        xp
    );

    localStorage.setItem(
        "mathScore",
        score
    );

    localStorage.setItem(
        "mathLevel",
        level
    );

    localStorage.setItem(
        "completedStages",
        JSON.stringify(completedStages)
    );

}


/* =========================================================
LEVEL
========================================================= */

function calculateLevel() {

    if (xp >= 1000) {

        level = 10;

    } else if (xp >= 800) {

        level = 9;

    } else if (xp >= 650) {

        level = 8;

    } else if (xp >= 500) {

        level = 7;

    } else if (xp >= 350) {

        level = 6;

    } else if (xp >= 250) {

        level = 5;

    } else if (xp >= 150) {

        level = 4;

    } else if (xp >= 100) {

        level = 3;

    } else if (xp >= 50) {

        level = 2;

    } else {

        level = 1;

    }

}


/* =========================================================
UPDATE STATS
========================================================= */

function updateStats() {

    calculateLevel();

    document.getElementById(
        "xp"
    ).textContent =
        xp;

    document.getElementById(
        "score"
    ).textContent =
        score;

    document.getElementById(
        "lives"
    ).textContent =
        lives;

    document.getElementById(
        "level"
    ).textContent =
        level;

    let completedWorldCount = 0;

    worlds.forEach((world, index) => {

        if (isWorldCompleted(index)) {

            completedWorldCount++;

        }

    });

    const progress =
        (completedWorldCount /
        worlds.length) * 100;

    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";

}


/* =========================================================
BACK TO MAP
========================================================= */

function backToMap() {

    game.classList.remove("active");

    result.classList.remove("active");

    stageMenu.classList.remove("active");

    map.style.display = "block";

    renderWorlds();

}


/* =========================================================
RESET GAME
========================================================= */

function resetGame() {

    const confirmReset =
        confirm(
            "Adakah anda pasti mahu reset semua progress?"
        );

    if (!confirmReset) return;

    localStorage.removeItem("mathXP");

    localStorage.removeItem("mathScore");

    localStorage.removeItem("mathLevel");

    localStorage.removeItem("completedStages");

    xp = 0;

    score = 0;

    level = 1;

    lives = 3;

    completedStages = {};

    backToMap();

}


/* =========================================================
START
========================================================= */

renderWorlds();

updateStats();

</script>
